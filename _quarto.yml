project:
  type: website

lang: en

website:
  title: "Explorer"
  site-url: "https://CarlFriedrichGauss1.github.io/notebook"
  favicon: favicon.png
  open-graph: true
  twitter-card: true
  navbar:
    right:
      - text: "Posts"
        href: index.qmd
      - text: "About"
        href: about.qmd
  page-footer:
    center: "© 2026 Explorer"

filters:
  - filters/tikzjax-compat.lua
  - diagram

diagram:
  engine:
    tikz:
      header-includes:
        - '\usepackage{amsmath,amssymb}'
        - '\usepackage{tikz-cd}'
        - '\usetikzlibrary{arrows.meta,positioning}'
        - '\definecolor{pagebg}{HTML}{FAF7F0}'
        - '\tikzcdset{background color=pagebg}'


format:
  html:
    theme: [cosmo, custom.scss]
    page-layout: custom
    toc: false
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
